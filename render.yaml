# Blueprint Render — Web Service.
#
# ⚠️ ESTE ARCHIVO DOCUMENTA LA CONFIGURACION, PERO NO LA GOBIERNA.
# El servicio se creo por API, no desde este Blueprint, asi que Render NO lo
# esta aplicando: el `healthCheckPath` declarado abajo, por ejemplo, esta vacio
# en el servicio real. Para que la infraestructura sea de verdad codigo hay que
# vincular el repo desde el dashboard (Blueprints -> New Blueprint Instance).
# Se pospuso a proposito: al sincronizar, Render puede borrar variables de
# entorno que se cargaron por fuera del archivo.
#
# El modelo real (models/random_forest_v1.joblib) esta versionado en el repo,
# por lo que el build NO entrena nada: solo instala dependencias y arranca.
# El artefacto lo produce la Fase 6.1 del notebook.
#
# DATASET_PATH apunta a la poblacion de demo (los 794 estudiantes con matricula
# vigente que exporta la Fase 6.3). Sin esa variable, /reporte cae a una
# poblacion sintetica de respaldo y reportaria sobre estudiantes inventados.

services:
  - type: web
    name: defenza-grado-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: MODELO_VERSION
        value: v1
      - key: UMBRAL_DEFAULT
        value: "0.5"
      - key: DATASET_PATH
        value: data/demo/estudiantes_matriculados.csv
      # Destinatario inicial del reporte. Es solo el valor de arranque: se
      # edita desde la interfaz y se guarda en DESTINO_PATH.
      - key: REPORTE_EMAIL_TO
        value: bienestar@utepsa.edu
    # El disco hace que los destinatarios sobrevivan a un redespliegue. Sin el
    # (plan gratuito), la configuracion vuelve a REPORTE_EMAIL_TO cada vez.
    # Requiere un plan de pago. Declarado como codigo, pero NO SE APLICA SOLO:
    # el servicio real no esta gobernado por este Blueprint (ver nota de arriba).
    # Para que tome efecto hay que, en el dashboard de Render:
    #   1. Settings -> Instance Type -> subir de Free a Starter (usa creditos)
    #   2. Settings -> Disks -> Add Disk, con estos mismos valores
    #   3. Agregar la variable DESTINO_PATH=/opt/render/project/src/data/destino.json
    # El paso 3 SI se puede hacer por API/MCP una vez exista el disco (no es un
    # secreto); los pasos 1 y 2 son cambios de plan y no hay tool de Render que
    # los exponga — quedan para hacerse a mano desde el dashboard.
    disk:
      name: datos
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    #
    # NO HAY CRON JOB, a proposito: el reporte se envia cuando alguien lo decide
    # desde el panel. Ver POST /reporte/enviar.
